<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Conectando</title>
  </head>
  <body>
    <p>Voltando para o painel.</p>
    <script>
      // O TikTok só aceita endereços https de retorno. Esta página recebe o
      // retorno e devolve o navegador para o painel no seu computador.
      location.replace('http://localhost:3377/auth/callback' + location.search);
    </script>
  </body>
</html>
